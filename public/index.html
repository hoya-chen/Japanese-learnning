<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b4a7e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日文入門">
<title>あいう日文入門</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 手機優先的單欄 App，底部分頁列；靛藍＝五十音、抹茶＝單字、櫻色＝文法 */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --fg:#1d2433; --muted:#5d6678; --line:#d9dee7;
  --ai:#2b4a7e; --ai-soft:#e3eaf6; --sakura:#c4566e; --sakura-soft:#f8e6ea;
  --matcha:#4f7a3a; --matcha-soft:#e6efdf; --ok:#2f8a4f; --ok-soft:#e1f2e6; --bad:#c2410c; --bad-soft:#fbe9df;
  --on-accent:#ffffff;
  --jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161f; --surface:#1a2030; --fg:#e6e9f0; --muted:#9aa3b5; --line:#2e374a;
  --ai:#8fb0e8; --ai-soft:#22304a; --sakura:#ec8ea2; --sakura-soft:#3a2229;
  --matcha:#9cc785; --matcha-soft:#243320; --ok:#6fd08f; --ok-soft:#1d3426; --bad:#f39a6b; --bad-soft:#3b261b;
  --on-accent:#12161f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161f; --surface:#1a2030; --fg:#e6e9f0; --muted:#9aa3b5; --line:#2e374a;
  --ai:#8fb0e8; --ai-soft:#22304a; --sakura:#ec8ea2; --sakura-soft:#3a2229;
  --matcha:#9cc785; --matcha-soft:#243320; --ok:#6fd08f; --ok-soft:#1d3426; --bad:#f39a6b; --bad-soft:#3b261b;
  --on-accent:#12161f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.jp{font-family:var(--jp)}
ruby rt{font-size:.5em;color:var(--muted);font-family:var(--jp)}
#main{max-width:720px;margin:0 auto;padding-block:20px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
body.focus #main{padding-bottom:40px}
h1,h2,h3{font-family:var(--jp);margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--ai);color:var(--on-accent)}
.btn.sec{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.m2{background:var(--matcha)} .btn.m3{background:var(--sakura)}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%;padding:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.92rem}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 16px;font-weight:500}
.seg button.on{background:var(--ai);color:var(--on-accent)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--ai);border-radius:99px;transition:width .3s}
.bar.m2 i{background:var(--matcha)} .bar.m3 i{background:var(--sakura)}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:inline-grid;place-items:center;flex:none}
.spk svg{width:18px;height:18px;fill:var(--ai)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px);text-align:center}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:transparent;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:.75rem;color:var(--muted)}
nav button b{font-family:var(--jp);font-size:1.35rem;line-height:1.3}
nav button.on{color:var(--ai)}
body.focus nav{display:none}
/* home */
.hero{display:flex;flex-direction:column;gap:6px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{font-size:1.7rem;font-variant-numeric:tabular-nums;font-family:var(--jp)}
.mod{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;text-align:left;width:100%}
.mod .ic{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-family:var(--jp);font-size:1.6rem;font-weight:700}
.ic.m1{background:var(--ai-soft);color:var(--ai)} .ic.m2{background:var(--matcha-soft);color:var(--matcha)} .ic.m3{background:var(--sakura-soft);color:var(--sakura)}
.next{background:var(--ai);color:var(--on-accent);border:0;border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.next .small{opacity:.85}
/* kana grid */
.grid{display:grid;gap:6px}
.grid.c5{grid-template-columns:repeat(5,1fr)} .grid.c3{grid-template-columns:repeat(3,1fr)}
.cell{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0}
.cell .k{font-family:var(--jp);font-size:1.7rem;line-height:1.2}
.cell .r{font-size:.75rem;color:var(--muted)}
.cell.blank{visibility:hidden}
.cell.hit{background:var(--ai-soft);border-color:var(--ai)}
.cell .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--line)}
.cell .dot.d1{background:var(--sakura)} .cell .dot.d2{background:var(--ok)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c)}
/* quiz */
.qhead{display:flex;align-items:center;gap:12px}
.qx{border:0;background:transparent;font-size:1.4rem;color:var(--muted);padding:0 4px}
.prompt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:180px;justify-content:center}
.prompt .big{font-family:var(--jp);font-size:3.6rem;line-height:1.2}
.prompt .mid{font-family:var(--jp);font-size:2rem;line-height:1.5}
.prompt .zh{font-size:1.5rem;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 8px;font-size:1.15rem;min-height:62px;text-align:center}
.opt.jpopt{font-family:var(--jp);font-size:1.5rem}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{min-height:24px;text-align:center;font-weight:700}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.result{text-align:center;align-items:center;padding:28px 16px}
.result .score{font-family:var(--jp);font-size:3rem;font-variant-numeric:tabular-nums}
/* vocab */
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.word{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.word .w{flex:1;min-width:0}
.word .j{font-family:var(--jp);font-size:1.25rem;line-height:1.5}
.word .z{font-size:.88rem;color:var(--muted)}
.lv{display:flex;gap:3px}
.lv i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.lv i.on{background:var(--matcha)}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px 16px;text-align:center;width:100%}
.flash .j{font-family:var(--jp);font-size:2.6rem;line-height:1.6}
.flash .z{font-size:1.4rem;font-weight:700}
/* grammar */
.lesson{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%}
.lesson .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sakura-soft);color:var(--sakura);font-weight:700;font-variant-numeric:tabular-nums}
.lesson .n.done{background:var(--ok);color:var(--on-accent)}
.lesson .p{font-family:var(--jp);font-size:1.1rem}
.pattern{font-family:var(--jp);font-size:1.5rem;color:var(--sakura)}
.ex{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:12px}
.ex .s{flex:1;min-width:0}
.ex .jj{font-family:var(--jp);font-size:1.3rem;line-height:2}
.romaji{font-size:.85rem;color:var(--muted);font-style:italic}
.answer{min-height:86px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:var(--surface)}
.answer.ok{border-color:var(--ok);border-style:solid;background:var(--ok-soft)}
.answer.bad{border-color:var(--bad);border-style:solid;background:var(--bad-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:56px}
.tile{border:1px solid var(--line);border-bottom-width:3px;background:var(--surface);border-radius:10px;padding:4px 12px;font-family:var(--jp);font-size:1.25rem;line-height:1.9}
.tile.used{visibility:hidden}
.settings .item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.settings .item:first-of-type{border-top:0}
.back{border:0;background:transparent;color:var(--muted);padding:0;font-size:.95rem;align-self:flex-start}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>

<main id="main" aria-live="polite"></main>
<nav aria-label="主選單"><div class="in">
  <button data-act="tab" data-v="home"><b>家</b>首頁</button>
  <button data-act="tab" data-v="kana"><b>あ</b>五十音</button>
  <button data-act="tab" data-v="vocab"><b>語</b>單字</button>
  <button data-act="tab" data-v="grammar"><b>文</b>文法</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- 工具 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return dkey(d)};
const SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const spkBtn=t=>`<button class="spk" data-act="say" data-t="${esc(t)}" aria-label="播放發音">${SPK}</button>`;
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800)}

/* ---------- 假名資料 ---------- */
const KSRC={
  seion:{name:'清音',cols:5,rows:["あ:a い:i う:u え:e お:o","か:ka き:ki く:ku け:ke こ:ko","さ:sa し:shi す:su せ:se そ:so","た:ta ち:chi つ:tsu て:te と:to","な:na に:ni ぬ:nu ね:ne の:no","は:ha ひ:hi ふ:fu へ:he ほ:ho","ま:ma み:mi む:mu め:me も:mo","や:ya - ゆ:yu - よ:yo","ら:ra り:ri る:ru れ:re ろ:ro","わ:wa - - - を:wo","ん:n - - - -"]},
  daku:{name:'濁音・半濁音',cols:5,rows:["が:ga ぎ:gi ぐ:gu げ:ge ご:go","ざ:za じ:ji ず:zu ぜ:ze ぞ:zo","だ:da ぢ:ji づ:zu で:de ど:do","ば:ba び:bi ぶ:bu べ:be ぼ:bo","ぱ:pa ぴ:pi ぷ:pu ぺ:pe ぽ:po"]},
  youon:{name:'拗音',cols:3,rows:["きゃ:kya きゅ:kyu きょ:kyo","しゃ:sha しゅ:shu しょ:sho","ちゃ:cha ちゅ:chu ちょ:cho","にゃ:nya にゅ:nyu にょ:nyo","ひゃ:hya ひゅ:hyu ひょ:hyo","みゃ:mya みゅ:myu みょ:myo","りゃ:rya りゅ:ryu りょ:ryo","ぎゃ:gya ぎゅ:gyu ぎょ:gyo","じゃ:ja じゅ:ju じょ:jo","びゃ:bya びゅ:byu びょ:byo","ぴゃ:pya ぴゅ:pyu ぴょ:pyo"]}
};
const toKata=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
const toHira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const KITEMS=[]; const RMAP={};
for(const g in KSRC){KSRC[g].grid=KSRC[g].rows.map(r=>r.split(' ').map(x=>{if(x==='-')return null;const[h,ro]=x.split(':');RMAP[h]=ro;return{h,r:ro}}));
  for(const s of ['h','k'])for(const row of KSRC[g].grid)for(const e of row)if(e)KITEMS.push({ch:s==='h'?e.h:toKata(e.h),r:e.r,g,s,quiz:!(e.h==='ぢ'||e.h==='づ')});}
Object.assign(RMAP,{'を':'o','ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o','ゃ':'ya','ゅ':'yu','ょ':'yo'});
const QKANA=KITEMS.filter(k=>k.quiz);
function romaji(kana){const s=toHira(kana);let o='',i=0;
  while(i<s.length){const c=s[i];
    if(c==='っ'){const nx=RMAP[s.substr(i+1,2)]||RMAP[s[i+1]];if(nx)o+=nx.startsWith('ch')?'t':nx[0];i++;continue}
    if(c==='ー'){const l=o.slice(-1);if('aiueo'.includes(l))o+=l;i++;continue}
    const two=s.substr(i,2);if(two.length===2&&RMAP[two]){o+=RMAP[two];i+=2;continue}
    if(RMAP[c]){let r=RMAP[c];if(c==='ん'&&s[i+1]&&'あいうえおやゆよ'.includes(s[i+1]))r="n'";o+=r;i++;continue}
    o+=c;i++}
  return o}
const tokRomaji=t=>t==='は'?'wa':t==='へ'?'e':t==='を'?'o':romaji(t.replace(/^では/,'でわ ').replace(/^には$/,'にわ'));

/* ---------- 單字資料 ---------- */
const VCATS={
 greet:['招呼語',["-|おはようございます|早安","-|こんにちは|你好（白天）|konnichiwa","-|こんばんは|晚上好|konbanwa","-|さようなら|再見","-|ありがとうございます|謝謝","-|すみません|不好意思／對不起","-|おやすみなさい|晚安（睡前）","-|いただきます|開動了","-|ごちそうさまでした|謝謝招待（吃完飯）","-|はい|是／好","-|いいえ|不是","お願いします|おねがいします|拜託了／麻煩你"]],
 num:['數字',["一|いち|一","二|に|二","三|さん|三","四|よん|四","五|ご|五","六|ろく|六","七|なな|七","八|はち|八","九|きゅう|九","十|じゅう|十","百|ひゃく|一百","千|せん|一千","万|まん|一萬","-|ゼロ|零","二十|にじゅう|二十"]],
 count:['數量・個數',["一つ|ひとつ|一個","二つ|ふたつ|兩個","三つ|みっつ|三個","四つ|よっつ|四個","五つ|いつつ|五個","六つ|むっつ|六個","七つ|ななつ|七個","八つ|やっつ|八個","九つ|ここのつ|九個","十|とお|十個","-|いくつ|幾個","一人|ひとり|一個人","二人|ふたり|兩個人","三人|さんにん|三個人","何人|なんにん|幾個人","一枚|いちまい|一張（紙、票）","一本|いっぽん|一支／一瓶","一杯|いっぱい|一杯","全部|ぜんぶ|全部"]],
 money:['錢・購物',["円|えん|日圓","-|いくら|多少錢","百円|ひゃくえん|一百日圓","千円|せんえん|一千日圓","一万円|いちまんえん|一萬日圓","財布|さいふ|錢包","値段|ねだん|價格","現金|げんきん|現金","-|カード|信用卡","お釣り|おつり|找的零錢","-|レシート|收據","払う|はらう|付錢","売る|うる|賣","税込み|ぜいこみ|含稅","買い物|かいもの|購物"]],

  <div class="grid c${g.cols}">${cells}</div>
  <div class="legend"><span style="--c:var(--line)">還沒練</span><span style="--c:var(--sakura)">練習中</span><span style="--c:var(--ok)">已掌握（連對 2 次）</span></div>

   <div class="row"><span class="muted small">文字</span><div class="seg">${[['h','平假名'],['k','片假名'],['hk','混合']].map(([k,n])=>`<button class="${UI.qScript===k?'on':''}" data-act="qscript" data-v="${k}">${n}</button>`).join('')}</div></div>

   <button class="btn block" data-act="kquiz">開始 10 題測驗</button></div>`;
}
function kanaQ(it,mode,pool){
  const others=pick(pool.filter(o=>o.r!==it.r&&o.s===it.s&&(o.g===it.g||pool.length<8)),3);
  const fill=others.length<3?pick(pool.filter(o=>o.r!==it.r&&!others.includes(o)),3-others.length):[];
  const opts=shuffle([it,...others,...fill]);
  const res=ok=>kResult(it.ch,ok);
  if(mode==='k2r')return{prompt:`<div class="big">${it.ch}</div><div class="muted small">這個字怎麼唸？</div>`,after:it.ch,opts:opts.map(o=>({l:o.r,ok:o===it})),res};
  if(mode==='a2k')return{prompt:`<button class="btn" data-act="say" data-t="${it.ch}">${SPK.replace('<svg','<svg style="width:22px;height:22px;fill:currentColor;vertical-align:middle"')} 再聽一次</button><div class="muted small">聽到的是哪個字？</div>`,auto:it.ch,jp:1,opts:opts.map(o=>({l:o.ch,ok:o===it})),res};
  return{prompt:`<div class="big" style="font-family:var(--body)">${it.r}</div><div class="muted small">哪個字讀作這個音？</div>`,after:it.ch,jp:1,opts:opts.map(o=>({l:o.ch,ok:o===it})),res};
}
function startKanaQuiz(){
  const gs=Object.keys(UI.qGroups).filter(k=>UI.qGroups[k]);if(!gs.length){toast('請至少選一個範圍');return}
  const pool=QKANA.filter(k=>gs.includes(k.g)&&UI.qScript.includes(k.s));
  const weak=shuffle(pool.filter(k=>kanaM(k.ch)<2)),strong=shuffle(pool.filter(k=>kanaM(k.ch)>=2));
  const items=[...weak,...strong].slice(0,10);
  Q={title:'五十音測驗',back:'kana',qs:shuffle(items).map(it=>kanaQ(it,UI.qMode,pool)),i:0,ok:0};go('quiz');
}

/* ---------- 測驗引擎 ---------- */
function vQuiz(){
  if(Q.i>=Q.qs.length){const pct=Math.round(Q.ok/Q.qs.length*100);if(Q.done){Q.done(pct);Q.done=null}save();
    return `<div class="card result"><span class="muted">${esc(Q.title)}</span><div class="score">${Q.ok} / ${Q.qs.length}</div>
    <p>${pct>=80?'過關！做得很好 🎉':pct>=50?'不錯，再練一次會更熟。':'先回去看看表格，再挑戰一次吧。'}</p>
    <div class="row" style="justify-content:center"><button class="btn sec" data-act="go" data-v="${Q.back}">返回</button><button class="btn" data-act="retry">再做一次</button></div></div>`}
  const q=Q.qs[Q.i];
  if(q.auto)setTimeout(()=>say(q.auto),250);
  return `<div class="qhead"><button class="qx" data-act="go" data-v="${Q.back}" aria-label="離開測驗">✕</button><div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div><span class="small muted" style="font-variant-numeric:tabular-nums">${Q.i+1}/${Q.qs.length}</span></div>
  <div class="prompt">${q.prompt}</div>
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt${q.jp?' jpopt':''}" data-act="ans" data-k="${k}">${o.l}</button>`).join('')}</div>
  <div class="fb" id="fb"></div><div id="nx"></div>`;
}
function answer(k){
  const q=Q.qs[Q.i];if(q.locked)return;q.locked=true;
  const ok=q.opts[k].ok;const bs=document.querySelectorAll('.opt');
  bs.forEach((b,i)=>{b.disabled=true;if(q.opts[i].ok)b.classList.add('ok');else if(i===k)b.classList.add('bad')});
  q.res(ok);logAnswer();if(ok)Q.ok++;save();
  if(q.after)say(q.after);
  const fb=$('#fb');fb.className='fb '+(ok?'ok':'bad');fb.textContent=ok?'答對了！':'再記一下正確答案';
  if(ok)setTimeout(()=>{if(V.name==='quiz'&&Q.qs[Q.i]===q){Q.i++;render()}},900);
  else $('#nx').innerHTML='<button class="btn block" data-act="qnext">下一題</button>';
}
function retryQuiz(){Q.qs=Q.qs.map(q=>({...q,locked:false,opts:shuffle(q.opts)}));Q.i=0;Q.ok=0;Q.done=Q.done0||null;render()}

function mkBuild(x){
  const extra=PARTS.filter(p=>!x.j.includes(p));const d=pick(extra,1)[0];
  const pool=x.j.map((t,i)=>({t,r:x.r[i]}));if(d)pool.push({t:d,r:d});
  return{x,pool:shuffle(pool).map((p,i)=>({...p,id:i})),picked:[],checked:false};
}
function startBuild(list,title,lid){B={title,lid,items:list.map(mkBuild),i:0,ok:0};go('build')}
function vBuild(){
  if(B.i>=B.items.length){const pct=Math.round(B.ok/B.items.length*100);
    if(B.lid&&!B.saved){const s=S.grammar[B.lid]||{};s.best=Math.max(s.best||0,pct);if(pct>=80)s.done=true;S.grammar[B.lid]=s;B.saved=true;save()}
    const g=B.lid&&GRAM.find(x=>x.id===B.lid+1);
    return `<div class="card result"><span class="muted">${esc(B.title)}</span><div class="score">${B.ok} / ${B.items.length}</div><p>${pct>=80?(B.lid?'過關！這課完成了 🎉':'做得很好 🎉'):'差一點，再排一次看看。'}</p>

  const it=B.items[B.i];const used=new Set(it.picked);
  return `<div class="qhead"><button class="qx" data-act="${B.lid?'lesson':'go'}" data-id="${B.lid||''}" data-v="grammar" aria-label="離開">✕</button><div class="bar m3"><i style="width:${B.i/B.items.length*100}%"></i></div><span class="small muted">${B.i+1}/${B.items.length}</span></div>
  <div class="prompt" style="min-height:120px"><div class="muted small">把這句話翻成日文</div><div class="zh">${esc(it.x.z)}</div></div>
  <div class="answer ${it.checked?(it.right?'ok':'bad'):''}" id="ans">${it.picked.map(id=>{const p=it.pool[id];return `<button class="tile" data-act="unpick" data-id="${id}" ${it.checked?'disabled':''}>${tokHtml(p.t,p.r)}</button>`}).join('')||'<span class="muted small">點下面的積木，依序排成句子</span>'}</div>
  <div class="pool">${it.pool.map(p=>`<button class="tile${used.has(p.id)?' used':''}" data-act="pick" data-id="${p.id}" ${it.checked?'disabled':''}>${tokHtml(p.t,p.r)}</button>`).join('')}</div>
  ${it.checked?`<div class="card"><b class="${it.right?'':''}" style="color:var(${it.right?'--ok':'--bad'})">${it.right?'答對了！':'正確答案是：'}</b><div class="ex" style="border:0;padding:0"><div class="s"><div class="jj">${sentHtml(it.x)}</div>${S.set.romaji?`<div class="romaji">${esc(sentRomaji(it.x))}</div>`:''}</div>${spkBtn(it.x.j.join(''))}</div></div>
    <button class="btn m3 block" data-act="bnext">下一句</button>`
  :`<div class="row"><button class="btn sec" data-act="bclear" style="flex:1">清除</button><button class="btn m3" data-act="bcheck" style="flex:2" ${it.picked.length?'':'disabled'}>檢查</button></div>`}`;
}
function bCheck(){const it=B.items[B.i];const s=it.picked.map(id=>it.pool[id].t).join('');it.checked=true;it.right=s===it.x.j.join('');if(it.right)B.ok++;logAnswer();save();render();say(it.x.j.join(''))}

   <div class="item"><div><b>語音速度</b></div><div class="seg">${[[0.65,'慢'],[0.85,'普通'],[1,'快']].map(([r,n])=>`<button class="${S.set.rate===r?'on':''}" data-act="rate" data-v="${r}">${n}</button>`).join('')}</div></div>
   <div class="item"><div><b>日語語音</b><p class="muted small">${!tts?'這個瀏覽器不支援語音朗讀。':jaVoice?'已找到日語語音：'+esc(jaVoice.name):'沒找到日語語音。手機或電腦的系統設定裡可以下載「日文」語音。'}</p></div>${spkBtn('こんにちは')}</div>
   <div class="item"><div><b>清除學習紀錄</b><p class="muted small">清掉這台裝置上的所有進度，無法復原</p></div><button class="btn ${resetArm?'':'sec'}" style="${resetArm?'background:var(--bad)':''}" data-act="reset">${resetArm?'確定清除':'清除'}</button></div>
  </div>
  <p class="muted small">進度只存在這個瀏覽器，換裝置或清除瀏覽資料後會重新開始。</p>`;
}

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case 'tab':case 'go':go(v);break;
    case 'next':NEXT&&NEXT.a();break;
    case 'say':say(b.dataset.t);break;
    case 'kscript':UI.kScript=v;render();break;
    case 'kgroup':UI.kGroup=v;UI.qGroups={[v]:true};render();break;
    case 'kana':UI.hit=b.dataset.ch;say(b.dataset.ch);document.querySelectorAll('.cell.hit').forEach(c=>c.classList.remove('hit'));b.classList.add('hit');break;
    case 'qmode':UI.qMode=v;render();break;
    case 'qscript':UI.qScript=v;render();break;
    case 'qgroup':UI.qGroups[v]=!UI.qGroups[v];render();break;
    case 'kquiz':startKanaQuiz();break;
    case 'ans':answer(+b.dataset.k);break;
    case 'qnext':Q.i++;render();break;
    case 'retry':retryQuiz();break;
    case 'vcat':UI.vCat=v;render();break;
    case 'flash':startFlash();break;
    case 'flip':F.flip=!F.flip;render();break;
    case 'fyes':{const c=F.cards[F.i];const s=S.vocab[c.id];if(!s||s.l<1)S.vocab[c.id]={l:1,d:addDays(1)};F.known++;logAnswer();save();F.i++;F.flip=false;render();break}
    case 'fno':{F.cards.push(F.cards[F.i]);logAnswer();F.i++;F.flip=false;if(F.cards.length>30)F.cards.length=30;render();break}
    case 'vquiz':startVocabQuiz(VOCAB.filter(x=>x.cat===UI.vCat),VCATS[UI.vCat][0]+' 測驗');break;
    case 'review':startReview();break;
    case 'lesson':go({name:'lesson',id:+b.dataset.id});break;
    case 'gbuild':{const g=GRAM.find(x=>x.id===+b.dataset.id);startBuild(shuffle(g.x),`第 ${g.id} 課 ${g.p}`,g.id);break}
    case 'gmix':{const xs=GRAM.filter(g=>(S.grammar[g.id]||{}).done).flatMap(g=>g.x);startBuild(pick(xs,10),'綜合造句練習',null);break}
    case 'pick':{const it=B.items[B.i];const id=+b.dataset.id;if(!it.picked.includes(id)){it.picked.push(id);say(it.pool[id].t)}render();break}
    case 'unpick':{const it=B.items[B.i];it.picked=it.picked.filter(x=>x!==+b.dataset.id);render();break}
    case 'bclear':B.items[B.i].picked=[];render();break;
    case 'bcheck':bCheck();break;
    case 'bnext':B.i++;render();break;
    case 'bretry':B.items=B.items.map(it=>mkBuild(it.x));B.i=0;B.ok=0;B.saved=false;render();break;
    case 'romaji':S.set.romaji=!S.set.romaji;save();render();break;
    case 'rate':S.set.rate=+v;save();render();say('こんにちは');break;
    case 'reset':if(!resetArm){resetArm=true;render();setTimeout(()=>{resetArm=false;if(V.name==='settings')render()},4000)}else{resetArm=false;S=defaults();save();toast('已清除學習紀錄');go('home')}break;
  }
});
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script>
</body>
</html>
